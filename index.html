<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>並列読み込みスピードテスト（修正版：集計整合 & キャッシュ可）</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body { font-family: system-ui, -apple-system, Roboto, "Noto Sans JP", sans-serif; padding:20px; max-width:980px; margin:auto; }
  label { display:inline-block; margin:8px 0; }
  input[type="number"] { width:90px; margin-left:8px; }
  input[type="text"] { width:300px; margin-left:8px; }
  button { padding:8px 14px; border-radius:8px; border:0; background:#1b74e4; color:#fff; cursor:pointer; }
  button:disabled { background:#9bbbf7; cursor:not-allowed; }
  .bar { height:16px; background:#eee; border-radius:8px; overflow:hidden; margin-top:12px; }
  .bar > i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#4caf50,#2bb673); transition:width 180ms linear; }
  table { width:100%; margin-top:12px; border-collapse:collapse; }
  th,td { padding:6px 8px; border-bottom:1px solid #eee; text-align:left; font-size:0.92rem; }
  .muted { color:#666; font-size:0.9rem; }
</style>
</head>
<body>
  <h1>並列読み込みスピードテスト（修正版）</h1>
  <p class="muted">接続デフォルト 25。ウォームアップと外れ値除去を行い、各接続の実際のウィンドウ時間で集計します。サーバーキャッシュ（Edge等）を有効のまま動作します。</p>

  <div>
    <label>接続数:
      <input id="connections" type="number" min="1" max="64" value="5" />
    </label>
    <label style="margin-left:12px">目標 (MiB):
      <input id="targetMiB" type="number" min="1" value="1000" />
    </label>
    <label style="margin-left:12px">ファイルURL:
      <input id="fileUrl" type="text" value="/10.dat" disabled />
    </label>
  </div>

  <div style="margin-top:10px">
    <button id="startBtn">テスト開始</button>
    <button id="stopBtn" disabled style="margin-left:8px; background:#e74c3c">強制停止</button>
  </div>

  <h2 style="margin-top:18px">アップロードテスト</h2>
  <div>
    <label>接続数:
      <input id="uploadConnections" type="number" min="1" max="64" value="2" />
    </label>
    <label style="margin-left:12px">目標 (MiB):
      <input id="uploadTargetMiB" type="number" min="1" value="200" />
    </label>
    <label style="margin-left:12px">アップロードURL:
      <input id="uploadUrl" type="text" value="/upload" disabled />
    </label>
  </div>

  <div style="margin-top:10px">
    <button id="startUploadBtn">アップロード開始</button>
    <button id="stopUploadBtn" disabled style="margin-left:8px; background:#e74c3c">アップロード停止</button>
  </div>

  <div id="uploadStatus" style="margin-top:10px" class="muted"></div>

  <div class="bar"><i id="uploadBarFill"></i></div>
  <div style="margin-top:8px">
    合計アップロード: <span id="uploadTotalMiB">0.00</span> MiB /
    <span id="uploadGoalMiB">0.00</span> MiB （経過: <span id="uploadElapsed">0.00</span> s）
  </div>

  <table id="uploadConnTable" style="display:none">
    <thead><tr><th>接続</th><th>送信 (MiB)</th><th>状態</th><th>瞬時速度 (Mbps)</th></tr></thead>
    <tbody id="uploadConnBody"></tbody>
  </table>

  <div id="status" style="margin-top:10px" class="muted"></div>

  <div class="bar"><i id="barFill"></i></div>
  <div style="margin-top:8px">
    合計読み込み: <span id="totalMiB">0.00</span> MiB /
    <span id="goalMiB">0.00</span> MiB （経過: <span id="elapsed">0.00</span> s）
  </div>

  <table id="connTable" style="display:none">
    <thead><tr><th>接続</th><th>読み込み (MiB)</th><th>状態</th><th>瞬時速度 (Mbps)</th></tr></thead>
    <tbody id="connBody"></tbody>
  </table>

  <div id="result" style="margin-top:12px; font-weight:600"></div>

<script>
(() => {
  const connectionsInput = document.getElementById('connections');
  const targetMiBInput = document.getElementById('targetMiB');
  const fileUrlInput = document.getElementById('fileUrl');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const statusDiv = document.getElementById('status');
  const barFill = document.getElementById('barFill');
  const totalMiBSpan = document.getElementById('totalMiB');
  const goalMiBSpan = document.getElementById('goalMiB');
  const elapsedSpan = document.getElementById('elapsed');
  const connTable = document.getElementById('connTable');
  const connBody = document.getElementById('connBody');
  const resultDiv = document.getElementById('result');

  const BYTES_PER_MIB = 1024 * 1024;

  // パラメータ（必要なら調整可）
  const WARMUP_MS = 1000;       // 各接続のウォームアップ時間
  const WINDOW_MS = 500;        // 各接続のスライディングウィンドウ幅（max）
  const UI_INTERVAL_MS = 200;   // UI 更新間隔
  const SAMPLE_HISTORY = 20;    // 直近サンプル数（中央値/MAD 用）
  const MAD_MULTIPLIER = 3.0;

  // Upload-specific constants
  const UPLOAD_CHUNK_SIZE = 64 * 1024; // 64KiB per chunk pushed into stream
  const UPLOAD_REQUEST_MiB = 1; // size of each upload request (MiB)

  let controller = null;
  let totalBytes = 0;
  let targetBytes = 0;
  let startTime = 0;
  let workers = [];
  let statsInterval = null;
  let running = false;
  const recentTotalSamples = [];

  // Upload state
  let uploadController = null;
  let uploadTotalBytes = 0;
  let uploadTargetBytes = 0;
  let uploadStartTime = 0;
  let uploadWorkers = [];
  let uploadStatsInterval = null;
  let uploadRunning = false;
  const uploadRecentSamples = [];

  function median(arr) {
    if (!arr.length) return 0;
    const a = arr.slice().sort((x,y)=>x-y);
    const m = Math.floor(a.length/2);
    return (a.length%2===1) ? a[m] : (a[m-1]+a[m])/2;
  }
  function mad(arr, med) {
    if (!arr.length) return 0;
    const dev = arr.map(v => Math.abs(v - med));
    return median(dev);
  }

  function makeConnRow(i) {
    const tr = document.createElement('tr');
    tr.id = 'conn-row-' + i;
    tr.innerHTML = `<td>${i+1}</td><td>0.00</td><td>idle</td><td>0.00</td>`;
    return tr;
  }

  function makeUploadRow(i) {
    const tr = document.createElement('tr');
    tr.id = 'upload-conn-row-' + i;
    tr.innerHTML = `<td>${i+1}</td><td>0.00</td><td>idle</td><td>0.00</td>`;
    return tr;
  }

  // ワーカーループ（fetch の URL にキャッシュバストを付けない -> キャッシュ有効）
  async function workerLoop(index, signal, fileUrl) {
    const now = performance.now();
    const w = {
      index,
      bytes: 0,
      // window 用のフィールド（ウィンドウは最後の reset 時点からの累積）
      windowBytesForCalc: 0,
      windowStartForCalc: now,
      warmupUntil: now + WARMUP_MS,
      state: 'starting'
    };
    workers[index] = w;
    connTable.style.display = '';
    connBody.appendChild(makeConnRow(index));

    try {
      while (!signal.aborted) {
        w.state = 'fetching';
        const url = fileUrl; // キャッシュを使いたいのでクエリは付けない
        let response;
        try {
          response = await fetch(url, { cache: 'no-store', signal });
        } catch (err) {
          if (signal.aborted) break;
          w.state = 'error(fetch)';
          w.err = err && err.message ? err.message : String(err);
          await new Promise(r => setTimeout(r, 300));
          continue;
        }
        if (!response.ok) { w.state = 'error(status:' + response.status + ')'; w.err = `status:${response.status}`; await new Promise(r=>setTimeout(r,300)); continue; }

        const reader = response.body.getReader();
        w.state = 'reading';
        while (!signal.aborted) {
          let readResult;
          try { readResult = await reader.read(); } catch (err) {
            if (signal.aborted) break;
            w.state = 'error(read)'; break;
          }
          if (readResult.done) break;
          const chunk = readResult.value;
          const n = chunk.length;

          // グローバル / ワーカーのバイトを更新
          totalBytes += n;
          w.bytes += n;

          const tnow = performance.now();
          // ウィンドウが古ければリセット（最大 WINDOW_MS）
          if ((tnow - w.windowStartForCalc) > WINDOW_MS) {
            w.windowStartForCalc = tnow;
            w.windowBytesForCalc = 0;
          }
          w.windowBytesForCalc += n;

          if (totalBytes >= targetBytes) {
            try { controller.abort(); } catch(e) {}
            break;
          }
        } // read loop end
        try { reader.releaseLock?.(); } catch(e) {}
        await Promise.resolve();
      } // main loop end
    } finally {
      w.state = signal.aborted ? 'aborted' : (w.state || 'finished');
      updateUI();
    }
  }

  // Upload worker: create a ReadableStream as request body and count bytes pushed
  async function uploadWorkerLoop(index, signal, uploadUrl, perRequestMiB = UPLOAD_REQUEST_MiB) {
    const now = performance.now();
    const w = {
      index,
      bytes: 0,
      windowBytesForCalc: 0,
      windowStartForCalc: now,
      warmupUntil: now + WARMUP_MS,
      state: 'starting'
    };
    uploadWorkers[index] = w;
    const uploadConnTable = document.getElementById('uploadConnTable');
    const uploadConnBody = document.getElementById('uploadConnBody');
    uploadConnTable.style.display = '';
    uploadConnBody.appendChild(makeUploadRow(index));

    const reqBytes = Math.max(1, Math.round(perRequestMiB * BYTES_PER_MIB));

    try {
      while (!signal.aborted) {
        w.state = 'preparing';
        // Use a Blob body for better server compatibility (some servers reject chunked streaming)
        w.state = 'uploading';
        try {
          // create a buffer filled with zeros. Keep memory reasonable (perRequestMiB default 1MiB)
          const buf = new Uint8Array(reqBytes);
          const resp = await fetch(uploadUrl, { method: 'POST', body: buf, headers: { 'Content-Type': 'application/octet-stream' }, signal });
          if (!resp.ok) {
            w.state = 'error(status:' + resp.status + ')';
            w.err = `status:${resp.status}`;
            await new Promise(r => setTimeout(r, 300));
            continue;
          }
          // count bytes only on successful send
          uploadTotalBytes += reqBytes;
          w.bytes += reqBytes;
          const tnow = performance.now();
          if ((tnow - w.windowStartForCalc) > WINDOW_MS) {
            w.windowStartForCalc = tnow;
            w.windowBytesForCalc = 0;
          }
          w.windowBytesForCalc += reqBytes;
        } catch (err) {
          if (signal.aborted) break;
          w.state = 'error(fetch)';
          w.err = err && err.message ? err.message : String(err);
          // small pause then retry
          await new Promise(r => setTimeout(r, 300));
          continue;
        }

        // If global target reached, abort
        if (uploadTotalBytes >= uploadTargetBytes) {
          try { uploadController.abort(); } catch(e) {}
          break;
        }
      }
    } finally {
      w.state = signal.aborted ? 'aborted' : (w.state || 'finished');
      updateUI();
    }
  }

  function updateUI() {
    const now = performance.now();
    const totalMiB = totalBytes / BYTES_PER_MIB;
    totalMiBSpan.textContent = totalMiB.toFixed(2);
    goalMiBSpan.textContent = (targetBytes / BYTES_PER_MIB).toFixed(2);
    elapsedSpan.textContent = ((now - startTime)/1000).toFixed(2);
    const progressPercent = Math.min(100, (totalBytes/targetBytes)*100) || 0;
    barFill.style.width = progressPercent + '%';

    // --- 正しく集計する方法 ---
    // 各接続について、その接続が保持する windowBytes とその実際の windowSec を使って
    // bits/sec を計算し、それを全て合算する（各接続を同一時間幅で無理にそろえない）
    // これにより「接続ごとに異なるウィンドウ長」での誇張を防ぐ。
    let totalBitsPerSec = 0;
    workers.forEach(w => {
      if (!w) return;
      // ウォームアップ期間中は無視（値に寄与させない）
      if (now < w.warmupUntil) return;
      // 実際のウィンドウ時間（ms）として、w.windowStartForCalc からの時間を使う（最大 WINDOW_MS）
      const winMs = Math.max(1, Math.min(WINDOW_MS, now - w.windowStartForCalc));
      const winSec = winMs / 1000;
      // bits in window = bytes * 8
      const bitsInWindow = w.windowBytesForCalc * 8;
      const bitsPerSec = bitsInWindow / winSec; // bits/second for this worker
      if (isFinite(bitsPerSec)) totalBitsPerSec += bitsPerSec;
    });

    // decimal Mbps に変換
    const instantMbpsRaw = totalBitsPerSec / 1_000_000;

    // サンプル履歴と中央値+MAD による外れ値除去
    recentTotalSamples.push(instantMbpsRaw);
    if (recentTotalSamples.length > SAMPLE_HISTORY) recentTotalSamples.shift();
    const med = median(recentTotalSamples);
    const dev = mad(recentTotalSamples, med);
    const threshold = (dev > 0) ? dev * MAD_MULTIPLIER : Math.max(0.5, med * 0.5);
    const filtered = recentTotalSamples.filter(s => Math.abs(s - med) <= threshold);
    const instantMbpsFiltered = filtered.length ? (filtered.reduce((a,b)=>a+b,0)/filtered.length) : med;

    statusDiv.textContent = `接続: ${workers.length} ｜ 現在速度 (フィルタ済): ${instantMbpsFiltered.toFixed(2)} Mbps ｜ 合計: ${totalMiB.toFixed(2)} MiB`;

    // per-connection 表示（各接続の瞬時 Mbps は接続個別の windowSec を使う）
    workers.forEach((w, i) => {
      const row = document.getElementById('conn-row-' + i);
      if (!row) return;
  const cells = row.children;
  cells[1].textContent = (w.bytes / BYTES_PER_MIB).toFixed(2);
  cells[2].textContent = w.state + (now < w.warmupUntil ? ' (warmup)' : '') + (w.err ? ' — ' + w.err : '');
      const winMs = Math.max(1, Math.min(WINDOW_MS, now - w.windowStartForCalc));
      const winSec = winMs / 1000;
      const connBits = w.windowBytesForCalc * 8;
      const connMbps = isFinite(connBits / winSec / 1_000_000) ? ((connBits / winSec) / 1_000_000).toFixed(2) : '0.00';
      cells[3].textContent = connMbps;
    });

    // --- Upload UI update ---
    const upNow = performance.now();
    const uploadMiB = uploadTotalBytes / BYTES_PER_MIB;
    document.getElementById('uploadTotalMiB').textContent = uploadMiB.toFixed(2);
    document.getElementById('uploadGoalMiB').textContent = (uploadTargetBytes / BYTES_PER_MIB).toFixed(2);
    document.getElementById('uploadElapsed').textContent = uploadStartTime ? ((upNow - uploadStartTime)/1000).toFixed(2) : '0.00';
    const upProgressPercent = uploadTargetBytes ? Math.min(100, (uploadTotalBytes/uploadTargetBytes)*100) : 0;
    document.getElementById('uploadBarFill').style.width = upProgressPercent + '%';

    // aggregate upload bits/sec across uploadWorkers
    let uploadTotalBitsPerSec = 0;
    uploadWorkers.forEach(w => {
      if (!w) return;
      if (upNow < w.warmupUntil) return;
      const winMs = Math.max(1, Math.min(WINDOW_MS, upNow - w.windowStartForCalc));
      const winSec = winMs / 1000;
      const bitsInWindow = (w.windowBytesForCalc || 0) * 8;
      const bitsPerSec = bitsInWindow / winSec;
      if (isFinite(bitsPerSec)) uploadTotalBitsPerSec += bitsPerSec;
    });
    const uploadInstantMbpsRaw = uploadTotalBitsPerSec / 1_000_000;
    uploadRecentSamples.push(uploadInstantMbpsRaw);
    if (uploadRecentSamples.length > SAMPLE_HISTORY) uploadRecentSamples.shift();
    const upMed = median(uploadRecentSamples);
    const upDev = mad(uploadRecentSamples, upMed);
    const upThreshold = (upDev > 0) ? upDev * MAD_MULTIPLIER : Math.max(0.5, upMed * 0.5);
    const upFiltered = uploadRecentSamples.filter(s => Math.abs(s - upMed) <= upThreshold);
    const uploadInstantMbpsFiltered = upFiltered.length ? (upFiltered.reduce((a,b)=>a+b,0)/upFiltered.length) : upMed;
    document.getElementById('uploadStatus').textContent = `接続: ${uploadWorkers.length} ｜ 現在アップロード速度 (フィルタ済): ${uploadInstantMbpsFiltered.toFixed(2)} Mbps ｜ 合計送信: ${uploadMiB.toFixed(2)} MiB`;

    uploadWorkers.forEach((w, i) => {
      const row = document.getElementById('upload-conn-row-' + i);
      if (!row) return;
  const cells = row.children;
  cells[1].textContent = (w.bytes / BYTES_PER_MIB).toFixed(2);
  cells[2].textContent = w.state + (upNow < w.warmupUntil ? ' (warmup)' : '') + (w.err ? ' — ' + w.err : '');
      const winMs = Math.max(1, Math.min(WINDOW_MS, upNow - w.windowStartForCalc));
      const winSec = winMs / 1000;
      const connBits = (w.windowBytesForCalc || 0) * 8;
      const connMbps = isFinite(connBits / winSec / 1_000_000) ? ((connBits / winSec) / 1_000_000).toFixed(2) : '0.00';
      cells[3].textContent = connMbps;
    });
  }

  function startTest() {
    if (running) return;
    const connCount = Math.max(1, Math.min(64, parseInt(connectionsInput.value || 25)));
    const targetMiB = Math.max(1, parseFloat(targetMiBInput.value || 200));
    const fileUrl = fileUrlInput.value.trim() || '/25.dat';

    controller = new AbortController();
    totalBytes = 0;
    targetBytes = Math.round(targetMiB * BYTES_PER_MIB);
    startTime = performance.now();
    workers = new Array(connCount);
    connBody.innerHTML = '';
    connTable.style.display = 'none';
    resultDiv.textContent = '';
    recentTotalSamples.length = 0;
    statusDiv.textContent = `接続を ${connCount} 本で開始中...`;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    running = true;

    for (let i = 0; i < connCount; i++) {
      workerLoop(i, controller.signal, fileUrl).catch(err => console.error('worker err', err));
    }

    statsInterval = setInterval(updateUI, UI_INTERVAL_MS);
    updateUI();

    const downloadDone = (async () => {
      try {
        await new Promise(resolve => {
          const sig = controller.signal;
          if (sig.aborted) return resolve();
          sig.addEventListener('abort', () => resolve(), { once: true });
        });
      } finally {
        finalize();
      }
    })();
    return downloadDone;
  }

  function finalize() {
    if (statsInterval) { clearInterval(statsInterval); statsInterval = null; }
    const endTime = performance.now();
    const durationSec = Math.max(0.001, (endTime - startTime) / 1000);
    const totalMiB = totalBytes / BYTES_PER_MIB;
    // 平均 Mbps (decimal)
    const avgMbps = (totalBytes * 8) / durationSec / 1_000_000;
    statusDiv.textContent = `計測終了 ｜ 平均速度: ${avgMbps.toFixed(2)} Mbps`;
    resultDiv.innerHTML = `
      合計読み込み: ${totalMiB.toFixed(2)} MiB (${totalBytes} bytes)<br>
      所要時間: ${durationSec.toFixed(3)} 秒<br>
      平均速度: <strong>${avgMbps.toFixed(2)} Mbps</strong>
    `;
    // Note: don't re-enable the global start button here when running combined test;
    // the caller (start button handler) controls overall flow. Keep stop button disabled.
    stopBtn.disabled = true;
    running = false;
    updateUI();
  }

  function stopTest() {
    if (!running || !controller) return;
    try { controller.abort(); } catch(e) {}
    stopBtn.disabled = true;
    statusDiv.textContent = '強制停止中...';
  }

  startBtn.addEventListener('click', () => {
    (async () => {
      // Combined flow: download then upload
      startBtn.disabled = true;
      try {
        goalMiBSpan.textContent = parseFloat(targetMiBInput.value || 0).toFixed(2);
        await startTest();
        // small pause
        await new Promise(r => setTimeout(r, 200));
        // start upload
        document.getElementById('uploadGoalMiB').textContent = parseFloat(uploadTargetMiBInput.value || 0).toFixed(2);
        await startUploadTest();
      } catch (err) {
        console.error('combined test error', err);
      } finally {
        startBtn.disabled = false;
      }
    })();
  });
  stopBtn.addEventListener('click', stopTest);

  // Upload controls
  const startUploadBtn = document.getElementById('startUploadBtn');
  const stopUploadBtn = document.getElementById('stopUploadBtn');
  const uploadConnectionsInput = document.getElementById('uploadConnections');
  const uploadTargetMiBInput = document.getElementById('uploadTargetMiB');
  const uploadUrlInput = document.getElementById('uploadUrl');

  function startUploadTest() {
    if (uploadRunning) return;
    const connCount = Math.max(1, Math.min(64, parseInt(uploadConnectionsInput.value || 2)));
    const targetMiB = Math.max(1, parseFloat(uploadTargetMiBInput.value || 100));
    const uploadUrl = uploadUrlInput.value.trim() || '/upload';

    uploadController = new AbortController();
    uploadTotalBytes = 0;
    uploadTargetBytes = Math.round(targetMiB * BYTES_PER_MIB);
    uploadStartTime = performance.now();
    uploadWorkers = new Array(connCount);
    document.getElementById('uploadConnBody').innerHTML = '';
    document.getElementById('uploadConnTable').style.display = 'none';
    uploadRecentSamples.length = 0;
    document.getElementById('uploadStatus').textContent = `接続を ${connCount} 本でアップロード開始中...`;
    startUploadBtn.disabled = true;
    stopUploadBtn.disabled = false;
    uploadRunning = true;

    for (let i = 0; i < connCount; i++) {
      uploadWorkerLoop(i, uploadController.signal, uploadUrl).catch(err => console.error('upload worker err', err));
    }

    uploadStatsInterval = setInterval(updateUI, UI_INTERVAL_MS);
    updateUI();
    const uploadDone = (async () => {
      try {
        await new Promise(resolve => {
          const sig = uploadController.signal;
          if (sig.aborted) return resolve();
          sig.addEventListener('abort', () => resolve(), { once: true });
        });
      } finally {
        finalizeUpload();
      }
    })();
    return uploadDone;
  }

  function finalizeUpload() {
    if (uploadStatsInterval) { clearInterval(uploadStatsInterval); uploadStatsInterval = null; }
    const endTime = performance.now();
    const durationSec = Math.max(0.001, (endTime - uploadStartTime) / 1000);
    const totalMiB = uploadTotalBytes / BYTES_PER_MIB;
    const avgMbps = (uploadTotalBytes * 8) / durationSec / 1_000_000;
    document.getElementById('uploadStatus').textContent = `アップロード計測終了 ｜ 平均速度: ${avgMbps.toFixed(2)} Mbps`;
    // show a compact result area (append inside resultDiv)
    const prev = resultDiv.innerHTML;
    resultDiv.innerHTML = prev + `<div style="margin-top:6px">アップロード: 合計送信 ${totalMiB.toFixed(2)} MiB (${uploadTotalBytes} bytes) ／ 所要時間 ${durationSec.toFixed(3)} 秒 ／ 平均 ${avgMbps.toFixed(2)} Mbps</div>`;
    startUploadBtn.disabled = false;
    stopUploadBtn.disabled = true;
    uploadRunning = false;
    updateUI();
  }

  function stopUploadTest() {
    if (!uploadRunning || !uploadController) return;
    try { uploadController.abort(); } catch(e) {}
    stopUploadBtn.disabled = true;
    document.getElementById('uploadStatus').textContent = 'アップロード強制停止中...';
  }

  startUploadBtn.addEventListener('click', () => {
    document.getElementById('uploadGoalMiB').textContent = parseFloat(uploadTargetMiBInput.value || 0).toFixed(2);
    startUploadTest();
  });
  stopUploadBtn.addEventListener('click', stopUploadTest);

})();
